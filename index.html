<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gogircin Empire - Real V13</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root { --blue: #3b82f6; --dark: #0f172a; --gold: #facc15; --diamond: #00d4ff; }
        body { margin: 0; background: #1e293b; font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; }
        
        .top-bar { background: rgba(0,0,0,0.85); padding: 12px; display: flex; justify-content: space-around; border-bottom: 2px solid #334155; position: relative; z-index: 10; }
        .res b { display: block; font-size: 16px; text-align: center; }
        
        #game-stage { height: 100vh; position: absolute; top:0; width: 100%; background: linear-gradient(180deg, #4facfe 0%, #00f2fe 100%); z-index: 1; }
        .bird { position: absolute; font-size: 45px; transition: 3s ease-in-out; z-index: 10; }
        .basket { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); font-size: 75px; z-index: 5; }

        /* Yeni Mini Oyun Alanı */
        #mini-game-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 3000; display: none; flex-direction: column; align-items: center; justify-content: center; }

        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-height: 80vh; background: var(--dark); border-radius: 25px; z-index: 2000; padding: 20px; display: none; overflow-y: auto; border: 2px solid var(--blue); }
        .btn { border: none; padding: 10px 16px; border-radius: 10px; font-weight: bold; color: white; cursor: pointer; background: var(--blue); width: 100%; margin-top: 10px; }
        #ton-connect-btn { margin-top: 10px; } /* TonConnect butonu için */
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="res" style="color:var(--gold);"><span>Yumurta</span><b id="bal-egg">0</b></div>
        <div class="res" style="color:var(--diamond);"><span>Elmas</span><b id="bal-dia">0</b></div>
    </div>

    <div id="game-stage">
        <div class="basket" onclick="collectEggs()">🧺</div>
    </div>

    <div id="modal-wallet" class="modal">
        <div style="display:flex; justify-content:space-between;"><h3>Finans & Ödeme</h3><span onclick="closeAll()">✖</span></div>
        
        <div style="background:#0f172a; padding:15px; border-radius:15px; margin-bottom:15px;">
            <b>⭐ Telegram Yıldızları ile Elmas</b>
            <p style="font-size:12px; color:#94a3b8;">1 Elmas = 1 Yıldız</p>
            <button class="btn" style="background:var(--gold); color:black;" onclick="realStarPay(10)">10 ⭐ SATIN AL</button>
            <button class="btn" style="background:var(--gold); color:black;" onclick="realStarPay(50)">50 ⭐ SATIN AL</button>
        </div>

        <div style="background:#0f172a; padding:15px; border-radius:15px;">
            <b>👛 Gerçek TON Cüzdanı</b>
            <div id="ton-connect-button"></div> <p id="wallet-info" style="font-size:10px; color:var(--diamond); margin-top:10px; word-break:break-all;"></p>
        </div>
    </div>

    <div id="mini-game-overlay">
        <h2 id="mg-timer">10</h2>
        <div id="mg-target" style="font-size:80px; cursor:pointer;" onclick="mgClick()">🥚</div>
        <p id="mg-score">Skor: 0</p>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 1. TON CONNECT ENTEGRASYONU (Gerçek Cüzdan Bağlama)
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://raw.githubusercontent.com/ton-connect/demo-dapp/main/public/tonconnect-manifest.json', // Buraya kendi manifest linkini koymalısın
        buttonRootId: 'ton-connect-button'
    });

    tonConnectUI.onStatusChange(wallet => {
        if (wallet) {
            document.getElementById('wallet-info').innerText = "Bağlı: " + wallet.account.address;
            gameData.wallet = wallet.account.address;
            save();
        }
    });

    // 2. GERÇEK YILDIZ ÖDEMESİ (BotFather'da ödemeler açık olmalı)
    function realStarPay(amount) {
        // Telegram botun üzerinden fatura oluşturur
        tg.openInvoice(`https://t.me/GogircinAdminBot?start=stars_${amount}`, (status) => {
            if(status === 'paid') {
                gameData.diaBal += amount;
                updateUI();
                tg.showAlert("Ödeme alındı! Elmaslar eklendi.");
            }
        });
    }

    // 3. MİNİ OYUN (Senin istediğin versiyon)
    let mgActive = false;
    let mgScore = 0;
    function startMiniGame() {
        closeAll();
        document.getElementById('mini-game-overlay').style.display = 'flex';
        mgScore = 0;
        mgActive = true;
        let timeLeft = 10;
        const timer = setInterval(() => {
            timeLeft--;
            document.getElementById('mg-timer').innerText = timeLeft;
            if(timeLeft <= 0) {
                clearInterval(timer);
                mgActive = false;
                tg.showAlert(`Oyun Bitti! Skorun: ${mgScore}. Ödül için reklam izle!`);
                // Buraya reklam kodu gelecek
                document.getElementById('mini-game-overlay').style.display = 'none';
            }
        }, 1000);
    }

    function mgClick() { if(mgActive) { mgScore++; document.getElementById('mg-score').innerText = "Skor: " + mgScore; } }

    // TEMEL OYUN MANTIĞI
    let gameData = { eggBal: 100, diaBal: 50, storage: 0, maxStorage: 100, wallet: null };
    if(localStorage.getItem('gogircin_v13')) gameData = JSON.parse(localStorage.getItem('gogircin_v13'));
    function save() { localStorage.setItem('gogircin_v13', JSON.stringify(gameData)); }

    function updateUI() {
        document.getElementById('bal-egg').innerText = Math.floor(gameData.eggBal);
        document.getElementById('bal-dia').innerText = Math.floor(gameData.diaBal);
        save();
    }

    function closeAll() {
        document.getElementById('modal-wallet').style.display = 'none';
    }

    function openModal(id) {
        document.getElementById('modal-' + id).style.display = 'block';
    }

    updateUI();
</script>
</body>
</html>
