<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gogircin Empire</title>

<!-- ADSGRAM -->
<script src="https://sad.adsgram.ai/js/adsgram-ad-controller.js"></script>

<style>
:root {
  --bg:#0f172a;
  --card:#1e293b;
  --blue:#3b82f6;
  --gold:#facc15;
  --green:#22c55e;
}

body {
  margin:0;
  background:var(--bg);
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

.top {
  display:flex;
  justify-content:space-around;
  padding:10px;
  background:#020617;
  border-bottom:2px solid #334155;
}

.res {
  text-align:center;
}
.res b {
  display:block;
  font-size:18px;
}
.res.gold b { color:var(--gold); }

.main {
  padding:20px;
}

.card {
  background:var(--card);
  border-radius:16px;
  padding:15px;
  margin-bottom:15px;
  border:1px solid #334155;
}

button {
  width:100%;
  padding:14px;
  font-size:16px;
  border:none;
  border-radius:14px;
  background:var(--blue);
  color:white;
  cursor:pointer;
}
button:active { transform:scale(0.97); }

#adBtn {
  background:linear-gradient(135deg,#22c55e,#16a34a);
  font-size:18px;
}

.log {
  font-size:13px;
  opacity:0.8;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- ÜST BAR -->
<div class="top">
  <div class="res gold">
    🥚
    <b id="eggs">0</b>
    Yumurta
  </div>
</div>

<!-- OYUN -->
<div class="main">

  <div class="card">
    <h3>📺 Reklam İzle</h3>
    <p>Reklam izleyerek ödül kazan.</p>
    <button id="adBtn" onclick="watchAd()">▶ Reklam İzle (+100 🥚)</button>
    <div class="log" id="log">Hazır</div>
  </div>

  <div class="card">
    <h3>🐦 Bilgi</h3>
    <p>Bu demo Adsgram entegrasyonu içindir.</p>
  </div>

</div>

<script>
/* ------------------------------
   OYUN DATASI
-------------------------------- */
const gameData = {
  eggs: 0
};

function updateUI() {
  document.getElementById("eggs").innerText = gameData.eggs;
}

/* ------------------------------
   ADSGRAM
-------------------------------- */
let adController = null;

window.addEventListener("load", () => {
  try {
    adController = new AdsgramAdController({
      blockId: 22286
    });
    log("Adsgram hazır");
  } catch (e) {
    log("Adsgram yüklenemedi");
  }
});

function watchAd() {
  if (!adController) {
    alert("Reklam hazır değil");
    return;
  }

  log("Reklam açılıyor...");

  adController.show()
    .then(() => {
      gameData.eggs += 100;
      updateUI();
      alert("🎉 Reklam izlendi! +100 Yumurta");
      log("Ödül verildi");
    })
    .catch(() => {
      alert("❌ Reklam gösterilemedi");
      log("Reklam iptal");
    });
}

/* ------------------------------
   LOG
-------------------------------- */
function log(msg) {
  document.getElementById("log").innerText = msg;
}

/* ------------------------------
   BAŞLAT
-------------------------------- */
updateUI();
</script>

</body>
</html>
