<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gogircin Empire - V10.1 Stable</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/adsgram-ad-controller.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { margin: 0; background: #1e293b; font-family: sans-serif; color: white; overflow: hidden; touch-action: manipulation; }
        .header { background: #0f172a; padding: 15px; display: flex; justify-content: space-around; border-bottom: 2px solid #3b82f6; position: relative; z-index: 100; }
        #game-area { height: 100vh; background: #4facfe; position: relative; z-index: 1; overflow: hidden; }
        .bird { position: absolute; font-size: 50px; transition: 2s linear; z-index: 10; pointer-events: none; }
        .basket { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); font-size: 80px; cursor: pointer; z-index: 20; }
        .menu-btn { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; z-index: 1000; border: 2px solid white; }
        .panel { position: fixed; bottom: 90px; right: 20px; background: #0f172a; width: 200px; border-radius: 15px; display: none; flex-direction: column; border: 1px solid #3b82f6; z-index: 999; }
        .panel-item { padding: 15px; color: white; border-bottom: 1px solid #334155; cursor: pointer; font-weight: bold; }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; background: #0f172a; padding: 20px; border-radius: 20px; display: none; border: 2px solid #3b82f6; z-index: 2000; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 1500; }
    </style>
</head>
<body>

    <div class="header">
        <div>🥚 <span id="eggs">0</span></div>
        <div>💎 <span id="gems">50</span></div>
    </div>

    <div id="game-area">
        <div class="basket" onclick="collect()">🧺</div>
    </div>

    <div class="menu-btn" onclick="toggleMenu()">🚀</div>

    <div id="main-panel" class="panel">
        <div class="panel-item" onclick="openM('shop')">🛒 KUŞ AL</div>
        <div class="panel-item" onclick="openM('wallet')">👛 CÜZDAN</div>
        <div class="panel-item" onclick="izleReklam()" style="color: #facc15;">💎 REKLAM İZLE (+10)</div>
    </div>

    <div id="overlay" class="overlay" onclick="closeAll()"></div>

    <div id="m-shop" class="modal">
        <h3>Pazar</h3>
        <div id="shop-items"></div>
        <button onclick="closeAll()" style="width:100%; margin-top:10px; padding:10px;">Kapat</button>
    </div>

    <div id="m-wallet" class="modal">
        <h3>Cüzdan & Ödeme</h3>
        <div id="ton-connect-button"></div>
        <button onclick="yildizAl()" style="width:100%; background:#facc15; padding:10px; margin-top:10px; border:none; border-radius:10px; font-weight:bold; color:black;">50 ⭐ Satın Al</button>
        <button onclick="closeAll()" style="width:100%; margin-top:10px; padding:10px;">Kapat</button>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // OYUN VERİLERİ (V10 MANTIĞI)
    let data = {
        eggs: 0, gems: 50, store: 0,
        birds: [
            { id: 0, name: "Mavi", icon: "🐦", rate: 10, owned: true, price: 0 },
            { id: 1, name: "Sarı", icon: "🐤", rate: 50, owned: false, price: 50 }
        ]
    };

    // Kayıt yükle
    const local = localStorage.getItem('gogircin_v10_1');
    if(local) data = JSON.parse(local);

    function save() { localStorage.setItem('gogircin_v10_1', JSON.stringify(data)); }

    function update() {
        document.getElementById('eggs').innerText = Math.floor(data.eggs);
        document.getElementById('gems').innerText = Math.floor(data.gems);
        renderShop();
        save();
    }

    // KUŞLARI OLUŞTUR (V10'DAN ALINDI)
    function createBird(bird) {
        if(!bird.owned || document.getElementById('b-'+bird.id)) return;
        const b = document.createElement('div');
        b.id = 'b-'+bird.id;
        b.className = 'bird';
        b.innerHTML = bird.icon;
        b.style.left = Math.random()*80+'%';
        b.style.top = (Math.random()*50+10)+'%';
        document.getElementById('game-area').appendChild(b);
        
        setInterval(() => {
            b.style.left = Math.random()*80+'%';
            b.style.top = (Math.random()*50+10)+'%';
        }, 3000);

        setInterval(() => {
            data.store += (bird.rate / 60);
            save();
        }, 1000);
    }

    function collect() {
        data.eggs += data.store;
        data.store = 0;
        update();
        tg.HapticFeedback.impactOccurred('light');
    }

    // REKLAM SİSTEMİ (SORUNSUZ ÇALIŞMASI İÇİN TRY-CATCH)
    function izleReklam() {
        try {
            const AdController = window.Adsgram.init({ blockId: "22286" });
            AdController.show().then(() => {
                data.gems += 10;
                update();
                tg.showAlert("Tebrikler! 10 Elmas kazandın.");
            }).catch(() => tg.showAlert("Reklam henüz hazır değil."));
        } catch(e) { tg.showAlert("Reklam sistemi yüklenemedi."); }
    }

    function yildizAl() {
        tg.showConfirm("50 Yıldız ile 50 Elmas alınsın mı?", (ok) => {
            if(ok) { data.gems += 50; update(); }
        });
    }

    // MENÜ KONTROLLERİ
    function renderShop() {
        const div = document.getElementById('shop-items');
        div.innerHTML = '';
        data.birds.forEach(b => {
            if(!b.owned) {
                div.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <span>${b.icon} ${b.name}</span>
                    <button onclick="buyB(${b.id})" style="background:#3b82f6; color:white; border:none; padding:5px; border-radius:5px;">${b.price} 💎</button>
                </div>`;
            }
        });
    }

    function buyB(id) {
        if(data.gems >= data.birds[id].price) {
            data.gems -= data.birds[id].price;
            data.birds[id].owned = true;
            createBird(data.birds[id]);
            update();
        } else { tg.showAlert("Yetersiz Elmas!"); }
    }

    function toggleMenu() {
        const p = document.getElementById('main-panel');
        p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
    }

    function openM(id) {
        closeAll();
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('m-'+id).style.display = 'block';
        if(id === 'wallet') initTon();
    }

    function closeAll() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('main-panel').style.display = 'none';
    }

    function initTon() {
        if(!window.tonButtonInit) {
            new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: 'https://hakk2793.github.io/gogircin-empire/tonconnect-manifest.json',
                buttonRootId: 'ton-connect-button'
            });
            window.tonButtonInit = true;
        }
    }

    // BAŞLAT
    window.onload = () => {
        data.birds.forEach(b => { if(b.owned) createBird(b); });
        update();
    };
</script>
</body>
</html>
