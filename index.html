<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gogircin Empire - V15 Adsgram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://sad.adsgram.ai/js/adsgram-ad-controller.js"></script>
    <style>
        :root { --blue: #3b82f6; --dark: #0f172a; --gold: #facc15; --dia: #00d4ff; }
        body { margin: 0; background: #1e293b; font-family: 'Segoe UI', sans-serif; color: white; height: 100vh; overflow: hidden; }
        
        .top-bar { background: rgba(0,0,0,0.85); padding: 12px; display: flex; justify-content: space-around; border-bottom: 2px solid #334155; z-index: 10; position: relative;}
        .res b { display: block; font-size: 16px; text-align: center; }

        #game-stage { height: 100vh; position: absolute; top:0; width: 100%; background: linear-gradient(180deg, #4facfe 0%, #00f2fe 100%); z-index: 1; }
        .basket { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); font-size: 75px; cursor: pointer; z-index: 5; }
        .storage-info { position: absolute; bottom: 105px; left: 50%; transform: translateX(-50%); font-size: 12px; background: rgba(0,0,0,0.7); padding: 6px 15px; border-radius: 20px; z-index: 5; border: 1px solid var(--blue); }

        #menu-toggle { position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px; background: var(--blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 1000; border: 3px solid white; cursor: pointer; box-shadow: 0 0 15px var(--blue); }
        #side-panel { position: fixed; bottom: 100px; right: 25px; background: var(--dark); width: 220px; border-radius: 20px; display: none; flex-direction: column; z-index: 999; border: 1px solid var(--blue); overflow: hidden; }
        .menu-item { padding: 15px; border-bottom: 1px solid #1e293b; color: white; font-weight: bold; background: none; border: none; text-align: left; cursor: pointer; width: 100%; }

        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-height: 80vh; background: var(--dark); border-radius: 25px; z-index: 2000; padding: 20px; display: none; overflow-y: auto; border: 2px solid var(--blue); }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display: none; z-index: 1500; backdrop-filter: blur(4px); }
        .btn { border: none; padding: 12px; border-radius: 10px; font-weight: bold; color: white; cursor: pointer; background: var(--blue); width: 100%; margin-top: 10px; }

        #mini-game-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); z-index: 3000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .bird { position: absolute; font-size: 45px; transition: 3s ease-in-out; z-index: 10; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3)); }
        .egg-anim { position: absolute; font-size: 18px; animation: toBasket 1s forwards; z-index: 5; }
        @keyframes toBasket { to { transform: translate(var(--tx), var(--ty)) scale(0.5); opacity: 0; } }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="res" style="color:var(--gold);"><span>Yumurta</span><b id="bal-egg">0</b></div>
        <div class="res" style="color:var(--dia);"><span>Elmas</span><b id="bal-dia">0</b></div>
    </div>

    <div id="game-stage">
        <div class="storage-info">Depo: <span id="store-val">0</span>/<span id="store-max">100</span></div>
        <div class="basket" onclick="collectEggs()">🧺</div>
    </div>

    <div id="menu-toggle" onclick="toggleMenu()">🚀</div>

    <div id="side-panel">
        <button class="menu-item" onclick="openModal('shop')">🛒 KUŞ SATIN AL</button>
        <button class="menu-item" onclick="openModal('wallet')">👛 CÜZDAN & ÖDEME</button>
        <button class="menu-item" onclick="startMiniGame()">🎮 MİNİ OYUN OYNA</button>
        <button class="menu-item" onclick="watchAdForBonus()" style="color:var(--gold);">💎 REKLAM İZLE (+10)</button>
    </div>

    <div class="overlay" id="overlay" onclick="closeAll()"></div>

    <div id="modal-wallet" class="modal">
        <div style="display:flex; justify-content:space-between;"><h3>Finans Merkezi</h3><span onclick="closeAll()">✖</span></div>
        <div style="background:#0f172a; padding:15px; border-radius:15px; margin-bottom:15px;">
            <b>⭐ Yıldız ile Hızlı Yükle</b>
            <button class="btn" style="background:var(--gold); color:black;" onclick="realStarPay(50)">50 ⭐ AL</button>
        </div>
        <div style="background:#0f172a; padding:15px; border-radius:15px;">
            <b>👛 TON Connect</b>
            <div id="ton-connect-button" style="margin-top:10px;"></div>
            <p id="wallet-info" style="font-size:10px; color:var(--dia); margin-top:10px; word-break:break-all;"></p>
        </div>
    </div>

    <div id="modal-shop" class="modal">
        <div style="display:flex; justify-content:space-between;"><h3>Kuş Pazarı</h3><span onclick="closeAll()">✖</span></div>
        <div id="bird-shop-list"></div>
    </div>

    <div id="mini-game-overlay">
        <h2 id="mg-timer">10</h2>
        <div id="mg-target" style="font-size:120px; cursor:pointer;" onclick="mgClick()">🥚</div>
        <p id="mg-score" style="font-size:20px;">Skor: 0</p>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // ADSGRAM ENTEGRASYONU (BLOCK ID: 22286)
    const AdController = window.Adsgram.init({ blockId: "22286" });

    // TON CONNECT
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://hakk2793.github.io/gogircin-empire/tonconnect-manifest.json',
        buttonRootId: 'ton-connect-button'
    });

    // OYUN VERİSİ
    let gameData = {
        eggBal: 100, diaBal: 50, storage: 0, maxStorage: 100,
        birds: [
            { id: 0, name: "Mavi", icon: "🐦", lvl: 1, rate: 10, owned: true },
            { id: 1, name: "Sarı", icon: "🐤", lvl: 0, rate: 45, owned: false, priceDia: 50 },
            { id: 2, name: "Papağan", icon: "🦜", lvl: 0, rate: 150, owned: false, priceDia: 200 },
            { id: 3, name: "Kartal", icon: "🦅", lvl: 0, rate: 400, owned: false, priceDia: 1000 }
        ]
    };

    if(localStorage.getItem('gogircin_v15')) gameData = JSON.parse(localStorage.getItem('gogircin_v15'));
    function save() { localStorage.setItem('gogircin_v15', JSON.stringify(gameData)); }

    // REKLAM İZLEME
    function watchAdForBonus() {
        AdController.show().then(() => {
            gameData.diaBal += 10;
            updateUI();
            tg.showAlert("Reklam başarıyla izlendi! +10 Elmas kazandın.");
        }).catch(() => {
            tg.showAlert("Reklam şu an hazır değil, lütfen sonra dene.");
        });
    }

    // YILDIZ ÖDEME (SİMÜLASYON)
    function realStarPay(amt) {
        tg.showConfirm(`${amt} Yıldız ile ${amt} Elmas yüklensin mi?`, (ok) => {
            if(ok) {
                gameData.diaBal += amt;
                updateUI();
                tg.showAlert("İşlem Başarılı!");
            }
        });
    }

    // MİNİ OYUN SİSTEMİ
    let mgActive = false, mgScore = 0;
    function startMiniGame() {
        closeAll();
        document.getElementById('mini-game-overlay').style.display = 'flex';
        mgScore = 0; mgActive = true;
        let t = 10;
        const timer = setInterval(() => {
            t--; document.getElementById('mg-timer').innerText = t;
            if(t <= 0 || !mgActive) {
                clearInterval(timer);
                stopMiniGame(mgScore);
            }
        }, 1000);
    }
    function mgClick() { if(mgActive) { mgScore++; document.getElementById('mg-score').innerText = "Skor: " + mgScore; } }
    function stopMiniGame(score) {
        mgActive = false;
        document.getElementById('mini-game-overlay').style.display = 'none';
        tg.showConfirm(`Oyun bitti! Skorun: ${score}. Reklam izleyerek 2 KAT (x20) ödül almak ister misin?`, (ok) => {
            if(ok) {
                AdController.show().then(() => {
                    gameData.eggBal += score * 20;
                    updateUI();
                    tg.showAlert("Reklam izlendi, 2 kat ödül yüklendi!");
                }).catch(() => {
                    gameData.eggBal += score * 10;
                    updateUI();
                });
            } else {
                gameData.eggBal += score * 10;
                updateUI();
            }
        });
    }

    // GENEL UI & KUŞ MANTIĞI
    function updateUI() {
        document.getElementById('bal-egg').innerText = Math.floor(gameData.eggBal);
        document.getElementById('bal-dia').innerText = Math.floor(gameData.diaBal);
        document.getElementById('store-val').innerText = Math.floor(gameData.storage);
        renderShop(); save();
    }

    function renderShop() {
        const l = document.getElementById('bird-shop-list'); l.innerHTML = '';
        gameData.birds.filter(b => !b.owned).forEach(b => {
            l.innerHTML += `<div style="background:#1e293b; padding:12px; border-radius:15px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; border:1px solid #334155;"><div><b>${b.icon} ${b.name}</b><br><small>${b.rate*60} 🥚/saat</small></div><button class="btn" style="width:auto; margin:0;" onclick="buyBird(${b.id})">${b.priceDia} 💎</button></div>`;
        });
    }

    function buyBird(id) {
        if(gameData.diaBal >= gameData.birds[id].priceDia) {
            gameData.diaBal -= gameData.birds[id].priceDia;
            gameData.birds[id].owned = true; addBirdToStage(gameData.birds[id]); updateUI();
        } else { tg.showAlert("Yetersiz Elmas!"); }
    }

    function addBirdToStage(b) {
        if(document.getElementById('sb-' + b.id)) return;
        const e = document.createElement('div');
        e.id = 'sb-' + b.id; e.className = 'bird'; e.innerHTML = b.icon;
        document.getElementById('game-stage').appendChild(e);
        setInterval(() => { e.style.left = Math.random()*80+"%"; e.style.top = (Math.random()*45+10)+"%"; }, 3000);
        setInterval(() => {
            if(gameData.storage < gameData.maxStorage) {
                createEggAnim(e);
                gameData.storage++; updateUI();
            }
        }, (60000 / b.rate));
    }

    function createEggAnim(b) {
        const eg = document.createElement('div'); eg.className = 'egg-anim'; eg.innerText = '🥚';
        eg.style.left = b.offsetLeft+"px"; eg.style.top = b.offsetTop+"px";
        eg.style.setProperty('--tx', ((window.innerWidth/2)-b.offsetLeft)+"px");
        eg.style.setProperty('--ty', ((window.innerHeight*0.75)-b.offsetTop)+"px");
        document.getElementById('game-stage').appendChild(eg);
        setTimeout(() => eg.remove(), 1000);
    }

    function collectEggs() { if(gameData.storage > 0) { gameData.eggBal += gameData.storage; gameData.storage = 0; updateUI(); } }
    function toggleMenu() { const p = document.getElementById('side-panel'); p.style.display = (p.style.display === 'flex') ? 'none' : 'flex'; }
    function openModal(id) { closeAll(); document.getElementById('overlay').style.display = 'block'; document.getElementById('modal-' + id).style.display = 'block'; }
    function closeAll() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); document.getElementById('overlay').style.display = 'none'; document.getElementById('side-panel').style.display = 'none'; }
    
    gameData.birds.filter(b => b.owned).forEach(addBirdToStage);
    updateUI();
</script>
</body>
</html>
