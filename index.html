<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titanic Empire - V11 Platinum</title>
    <script src="https://sad.adsgram.ai/js/adsgram-ad-sdk.js" defer></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js" defer></script>
    <style>
        :root { --blue: #3b82f6; --dark: #0f172a; --gold: #facc15; --diamond: #00d4ff; --purple: #a855f7; --green: #22c55e; }
        body { margin: 0; background: #1e293b; font-family: 'Segoe UI', sans-serif; color: white; height: 100vh; overflow: hidden; }
        
        .top-bar { background: rgba(0,0,0,0.85); padding: 12px; display: flex; justify-content: space-around; border-bottom: 2px solid #334155; z-index: 10; position: relative;}
        .res b { display: block; font-size: 16px; text-align: center; }
        .res.egg b { color: var(--gold); }
        .res.dia b { color: var(--diamond); }

        #game-stage { height: 100vh; position: absolute; top:0; width: 100%; background: linear-gradient(180deg, #1e3a8a 0%, #1e293b 100%); z-index: 1; }
        .bird { position: absolute; font-size: 45px; transition: 3s ease-in-out; z-index: 10; }
        .egg-anim { position: absolute; font-size: 18px; animation: toBasket 1s forwards; z-index: 5; }
        @keyframes toBasket { to { transform: translate(var(--tx), var(--ty)) scale(0.5); opacity: 0; } }

        .basket { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); font-size: 75px; cursor: pointer; z-index: 5; }
        .storage-info { position: absolute; bottom: 105px; left: 50%; transform: translateX(-50%); font-size: 12px; background: rgba(0,0,0,0.7); padding: 6px 15px; border-radius: 20px; z-index: 5; border: 1px solid var(--blue); }

        #menu-toggle { position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px; background: var(--blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 1000; border: 3px solid white; cursor: pointer; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        
        #side-panel { position: fixed; bottom: 100px; right: 25px; background: var(--dark); width: 220px; border-radius: 20px; display: none; flex-direction: column; z-index: 999; border: 1px solid var(--blue); overflow: hidden; }
        .menu-item { padding: 15px; border-bottom: 1px solid #1e293b; color: white; font-weight: bold; background: none; border: none; text-align: left; width: 100%; }

        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-height: 80vh; background: var(--dark); border-radius: 25px; z-index: 2000; padding: 20px; display: none; overflow-y: auto; border: 2px solid var(--blue); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; margin-bottom: 15px; padding-bottom: 10px; }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display: none; z-index: 1500; backdrop-filter: blur(4px); }

        .card { background: #1e293b; padding: 12px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .btn { border: none; padding: 10px 16px; border-radius: 10px; font-weight: bold; color: white; cursor: pointer; background: var(--blue); }
    </style>
</head>
<body>
    <div id="ton-connect-button" style="position: fixed; top: 12px; right: 12px; z-index: 9999;"></div>

    <div class="top-bar">
        <div class="res egg"><span>Yumurta</span><b id="bal-egg">0</b></div>
        <div class="res dia"><span>Elmas</span><b id="bal-dia">0</b></div>
    </div>

    <div id="game-stage">
        <div class="storage-info">Depo: <span id="store-val">0</span>/<span id="store-max">100</span></div>
        <div class="basket" onclick="collectEggs()">🧺</div>
    </div>

    <div id="menu-toggle" onclick="toggleMenu()">🚢</div>

    <div id="side-panel">
        <button class="menu-item" onclick="openModal('birds')">🦅 KUŞLARIM</button>
        <button class="menu-item" onclick="openModal('shop')">🛒 MAĞAZA</button>
        <button class="menu-item" onclick="openModal('wallet')">👛 CÜZDAN & REKLAM</button>
        <button class="menu-item" onclick="openModal('bonus')">🎁 GÜNLÜK HEDİYE</button>
    </div>

    <div class="overlay" id="overlay" onclick="closeAll()"></div>

    <div id="modal-birds" class="modal">
        <div class="modal-header"><h3>Titanic Kümesi</h3><span onclick="closeAll()">✖</span></div>
        <div id="birds-list"></div>
    </div>

    <div id="modal-shop" class="modal">
        <div class="modal-header"><h3>Titanic Pazarı</h3><span onclick="closeAll()">✖</span></div>
        <div id="bird-shop-list"></div>
    </div>

    <div id="modal-wallet" class="modal">
        <div class="modal-header"><h3>Finans Merkezi</h3><span onclick="closeAll()">✖</span></div>
        <button class="btn" style="width:100%; background:var(--gold); color:black; margin-bottom:15px; padding:15px;" onclick="izleReklam()">🎬 VİDEO İZLE (+10 💎)</button>
        <div class="card">
            <b>👛 TON Cüzdan</b>
            <p id="wallet-display" style="font-size:11px;">Bağlı Değil</p>
        </div>
    </div>

    <div id="modal-bonus" class="modal" style="text-align:center;">
        <div class="modal-header"><h3>Günlük Bonus</h3><span onclick="closeAll()">✖</span></div>
        <button id="daily-btn" class="btn" style="width:100%; padding:20px;" onclick="claimDaily()">HEDİYEYİ AL 🎁</button>
        <p id="timer" style="margin-top:10px; font-size:12px;"></p>
    </div>

<script>
    // Görseldeki 127. satır ve sonrası düzeltildi
    let gameData = {
        eggBal: 100, diaBal: 50, storage: 0, maxStorage: 100, lastDaily: 0,
        birds: [
            { id: 0, name: "Mavi", icon: "🐦", lvl: 1, rate: 10, owned: true },
            { id: 1, name: "Sarı", icon: "🐤", lvl: 0, rate: 45, owned: false, priceDia: 50 },
            { id: 2, name: "Yeşil", icon: "🦜", lvl: 0, rate: 150, owned: false, priceDia: 200 },
            { id: 3, name: "Kartal", icon: "🦅", lvl: 0, rate: 400, owned: false, priceDia: 1000 }
        ]
    };

    if(localStorage.getItem('titanic_v11')) gameData = JSON.parse(localStorage.getItem('titanic_v11'));
    function save() { localStorage.setItem('titanic_v11', JSON.stringify(gameData)); }

    async function izleReklam() {
        try {
            const ad = window.Adsgram.init({ blockId: "22528" });
            const result = await ad.show();
            if (result.done) {
                gameData.diaBal += 10;
                updateUI();
                alert("10 Elmas Titanic kasanıza eklendi!");
            }
        } catch (e) { alert("Reklam hazır değil."); }
    }

    function updateUI() {
        document.getElementById('bal-egg').innerText = Math.floor(gameData.eggBal);
        document.getElementById('bal-dia').innerText = Math.floor(gameData.diaBal);
        document.getElementById('store-val').innerText = Math.floor(gameData.storage);
        document.getElementById('store-max').innerText = gameData.maxStorage;
        renderBirds(); renderShop(); checkDailyTimer(); save();
    }

    function toggleMenu() {
        const p = document.getElementById('side-panel');
        p.style.display = (p.style.display === 'flex') ? 'none' : 'flex';
    }

    function openModal(id) {
        closeAll();
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('modal-' + id).style.display = 'block';
    }

    function closeAll() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('side-panel').style.display = 'none';
    }

    function renderBirds() {
        const list = document.getElementById('birds-list'); list.innerHTML = '';
        gameData.birds.filter(b => b.owned).forEach(b => {
            list.innerHTML += `<div class="card">
                <div><b>${b.icon} ${b.name}</b><br><span>Lvl ${b.lvl}</span></div>
                <button class="btn" onclick="upgradeBird(${b.id})">UP (${b.lvl * 200} 🥚)</button>
            </div>`;
        });
    }

    function renderShop() {
        const list = document.getElementById('bird-shop-list'); list.innerHTML = '';
        gameData.birds.filter(b => !b.owned).forEach(b => {
            list.innerHTML += `<div class="card">
                <div><b>${b.icon} ${b.name}</b></div>
                <button class="btn" onclick="buyBird(${b.id})">${b.priceDia} 💎</button>
            </div>`;
        });
    }

    function buyBird(id) {
        if(gameData.diaBal >= gameData.birds[id].priceDia) {
            gameData.diaBal -= gameData.birds[id].priceDia;
            gameData.birds[id].owned = true; gameData.birds[id].lvl = 1;
            addBirdToStage(gameData.birds[id]); updateUI();
        } else { alert("Yetersiz Elmas!"); }
    }

    function addBirdToStage(b) {
        if(document.getElementById('stage-bird-' + b.id)) return;
        const el = document.createElement('div');
        el.id = 'stage-bird-' + b.id; el.className = 'bird'; el.innerHTML = b.icon;
        document.getElementById('game-stage').appendChild(el);
        setInterval(() => { el.style.left = Math.random() * 80 + "%"; el.style.top = (Math.random() * 45 + 10) + "%"; }, 3000);
        setInterval(() => createEgg(b.id), (60000 / b.rate));
    }

    function createEgg(birdId) {
        if(gameData.storage >= gameData.maxStorage) return;
        const bird = document.getElementById('stage-bird-' + birdId); if(!bird) return;
        const egg = document.createElement('div');
        egg.className = 'egg-anim'; egg.innerText = '🥚';
        egg.style.left = bird.offsetLeft + "px"; egg.style.top = bird.offsetTop + "px";
        egg.style.setProperty('--tx', ((window.innerWidth/2) - bird.offsetLeft) + "px");
        egg.style.setProperty('--ty', ((window.innerHeight*0.75) - bird.offsetTop) + "px");
        document.getElementById('game-stage').appendChild(egg);
        setTimeout(() => { egg.remove(); gameData.storage = Math.min(gameData.storage + 1, gameData.maxStorage); updateUI(); }, 1000);
    }

    function collectEggs() { if(gameData.storage > 0) { gameData.eggBal += gameData.storage; gameData.storage = 0; updateUI(); } }

    function upgradeBird(id) {
        let cost = gameData.birds[id].lvl * 200;
        if(gameData.eggBal >= cost) { gameData.eggBal -= cost; gameData.birds[id].lvl++; gameData.birds[id].rate = Math.floor(gameData.birds[id].rate * 1.15); updateUI(); }
    }

    function claimDaily() {
        let n = new Date().getTime();
        if(n - gameData.lastDaily > 86400000) { gameData.eggBal += 300; gameData.lastDaily = n; updateUI(); alert("300 🥚 Titanic ödülü alındı!"); }
    }

    function checkDailyTimer() {
        let d = 86400000 - (new Date().getTime() - gameData.lastDaily);
        document.getElementById('timer').innerText = d > 0 ? "Kalan: " + Math.floor(d/3600000) + " saat" : "Hediye Hazır!";
    }

    // --- KRİTİK BAŞLATICI ---
    window.onload = () => {
        gameData.birds.filter(b => b.owned).forEach(addBirdToStage);
        updateUI();
        // GitHub deponla (gogircin-empire) uyumlu hale getirildi
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://hakk2793.github.io/gogircin-empire/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });
    };
</script>
</body>
</html>
