<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gogircin Empire - V12 Stabil</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --blue: #3b82f6; --dark: #0f172a; --gold: #facc15; --diamond: #00d4ff; --purple: #a855f7; --green: #22c55e; }
        body { margin: 0; background: #1e293b; font-family: 'Segoe UI', sans-serif; color: white; height: 100vh; overflow: hidden; }
        
        /* Üst Panel */
        .top-bar { background: rgba(0,0,0,0.85); padding: 12px; display: flex; justify-content: space-around; border-bottom: 2px solid #334155; z-index: 10; position: relative;}
        .res b { display: block; font-size: 16px; text-align: center; }
        .res.egg b { color: var(--gold); }
        .res.dia b { color: var(--diamond); }

        /* Oyun Sahnesi */
        #game-stage { height: 100vh; position: absolute; top:0; width: 100%; background: linear-gradient(180deg, #4facfe 0%, #00f2fe 100%); z-index: 1; }
        .bird { position: absolute; font-size: 45px; transition: 3s ease-in-out; z-index: 10; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3)); }
        .egg-anim { position: absolute; font-size: 18px; animation: toBasket 1s forwards; z-index: 5; }
        @keyframes toBasket { to { transform: translate(var(--tx), var(--ty)) scale(0.5); opacity: 0; } }

        .basket { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); font-size: 75px; cursor: pointer; z-index: 5; }
        .storage-info { position: absolute; bottom: 105px; left: 50%; transform: translateX(-50%); font-size: 12px; background: rgba(0,0,0,0.7); padding: 6px 15px; border-radius: 20px; z-index: 5; border: 1px solid var(--blue); }

        /* Menü Butonu */
        #menu-toggle { position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px; background: var(--blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 1000; border: 3px solid white; cursor: pointer; box-shadow: 0 0 15px var(--blue); }
        
        #side-panel { position: fixed; bottom: 100px; right: 25px; background: var(--dark); width: 220px; border-radius: 20px; display: none; flex-direction: column; z-index: 999; border: 1px solid var(--blue); overflow: hidden; }
        .menu-item { padding: 15px; border-bottom: 1px solid #1e293b; color: white; font-weight: bold; background: none; border: none; text-align: left; cursor: pointer; width: 100%; }

        /* Modallar */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-height: 80vh; background: var(--dark); border-radius: 25px; z-index: 2000; padding: 20px; display: none; overflow-y: auto; border: 2px solid var(--blue); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; margin-bottom: 15px; padding-bottom: 5px; }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display: none; z-index: 1500; backdrop-filter: blur(4px); }

        .card { background: #1e293b; padding: 12px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .btn { border: none; padding: 10px 16px; border-radius: 10px; font-weight: bold; color: white; cursor: pointer; background: var(--blue); }
        
        .news-ticker { background: #0f172a; padding: 8px; border-radius: 10px; margin-top: 15px; overflow: hidden; white-space: nowrap; }
        .news-ticker span { display: inline-block; padding-left: 100%; animation: marquee 20s linear infinite; color: var(--gold); font-size: 13px; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="res egg"><span>Yumurta</span><b id="bal-egg">0</b></div>
        <div class="res dia"><span>Elmas</span><b id="bal-dia">0</b></div>
    </div>

    <div id="game-stage">
        <div class="storage-info">Depo: <span id="store-val">0</span>/<span id="store-max">100</span></div>
        <div class="basket" onclick="collectEggs()">🧺</div>
    </div>

    <div id="menu-toggle" onclick="toggleMenu()">🚀</div>

    <div id="side-panel">
        <button class="menu-item" onclick="openModal('birds')">🦅 KUŞLARIM</button>
        <button class="menu-item" onclick="openModal('shop')">🛒 MAĞAZA</button>
        <button class="menu-item" onclick="openModal('wallet')">👛 CÜZDAN & ⭐</button>
        <button class="menu-item" onclick="openModal('wheel')">🎡 ÇARK</button>
        <button class="menu-item" onclick="openModal('bonus')">🎁 HEDİYE</button>
    </div>

    <div class="overlay" id="overlay" onclick="closeAll()"></div>

    <div id="modal-birds" class="modal"><div class="modal-header"><h3>Kümes</h3><span onclick="closeAll()">✖</span></div><div id="birds-list"></div></div>

    <div id="modal-shop" class="modal"><div class="modal-header"><h3>Pazar</h3><span onclick="closeAll()">✖</span></div><div id="bird-shop-list"></div></div>

    <div id="modal-wallet" class="modal">
        <div class="modal-header"><h3>Finans</h3><span onclick="closeAll()">✖</span></div>
        <div class="card" style="background: linear-gradient(45deg, #6366f1, #a855f7);">
            <div><b>💎 Elmas Yükle</b><br><small>1 Yıldız = 1 Elmas</small></div>
            <div style="display:flex; gap:5px;">
                <button class="btn" onclick="buyWithStars(10)">10 ⭐</button>
                <button class="btn" onclick="buyWithStars(50)">50 ⭐</button>
            </div>
        </div>
        <div class="card" style="display:block;">
            <b>👛 TON Cüzdanı</b>
            <p id="wallet-text" style="font-size:11px; color:var(--diamond); word-break:break-all; margin:10px 0;">Bağlı Değil</p>
            <button class="btn" style="width:100%; background:#0098ea;" onclick="connectWallet()">CÜZDAN BAĞLA</button>
        </div>
        <div class="news-ticker"><span id="ticker-text">🔥 @Kral 50 ⭐ yükledi! • 💎 Elmaslar tıkır tıkır geliyor!</span></div>
    </div>

    <div id="modal-wheel" class="modal" style="text-align:center;">
        <div class="modal-header"><h3>Şans Çarkı</h3><span onclick="closeAll()">✖</span></div>
        <div id="wheel-display" style="font-size:60px; transition: 3s cubic-bezier(0.1, 0, 0, 1);">🎡</div>
        <button id="spin-btn" class="btn" style="width:100%; background:var(--gold); color:black; margin-top:15px;" onclick="spinWheel()">10 💎 İLE ÇEVİR</button>
        <p id="wheel-status" style="margin-top:10px; font-size:14px; color:var(--gold);"></p>
    </div>

    <div id="modal-bonus" class="modal" style="text-align:center;">
        <div class="modal-header"><h3>Günlük Bonus</h3><span onclick="closeAll()">✖</span></div>
        <button id="daily-btn" class="btn" style="width:100%; padding:20px;" onclick="claimDaily()">HEDİYEYİ AL 🎁</button>
        <p id="timer" style="margin-top:10px; font-size:12px;"></p>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let gameData = {
        eggBal: 100, diaBal: 50, storage: 0, maxStorage: 100, lastDaily: 0, wallet: null,
        birds: [
            { id: 0, name: "Mavi", icon: "🐦", lvl: 1, rate: 10, owned: true },
            { id: 1, name: "Sarı", icon: "🐤", lvl: 0, rate: 45, owned: false, priceDia: 50 },
            { id: 2, name: "Papağan", icon: "🦜", lvl: 0, rate: 150, owned: false, priceDia: 200 },
            { id: 3, name: "Kartal", icon: "🦅", lvl: 0, rate: 400, owned: false, priceDia: 1000 }
        ]
    };

    if(localStorage.getItem('gogircin_v12')) gameData = JSON.parse(localStorage.getItem('gogircin_v12'));
    function save() { localStorage.setItem('gogircin_v12', JSON.stringify(gameData)); }

    function updateUI() {
        document.getElementById('bal-egg').innerText = Math.floor(gameData.eggBal);
        document.getElementById('bal-dia').innerText = Math.floor(gameData.diaBal);
        document.getElementById('store-val').innerText = Math.floor(gameData.storage);
        document.getElementById('store-max').innerText = gameData.maxStorage;
        if(gameData.wallet) document.getElementById('wallet-text').innerText = gameData.wallet;
        renderBirds(); renderShop(); checkDailyTimer(); save();
    }

    // TELEGRAM YILDIZ ENTEGRASYONU (1 ELMAS = 1 YILDIZ)
    function buyWithStars(amount) {
        tg.showConfirm(`${amount} Yıldız harcayarak ${amount} Elmas almak istiyor musun?`, (ok) => {
            if(ok) {
                gameData.diaBal += amount;
                addTickerMessage(`💎 BİRİSİ ${amount} YILDIZ YÜKLEDİ!`);
                updateUI();
                tg.showAlert("Ödeme Başarılı! Elmaslar hesabına eklendi.");
            }
        });
    }

    // CÜZDAN BAĞLAMA (FIXED)
    function connectWallet() {
        let addr = prompt("TON Cüzdan Adresini Gir:");
        if(addr && addr.length > 10) {
            gameData.wallet = addr;
            updateUI();
            addTickerMessage("👛 Bir kullanıcı cüzdan bağladı!");
            tg.showAlert("Cüzdan Başarıyla Bağlandı.");
        }
    }

    // ŞANS ÇARKINI ÇEVİR
    function spinWheel() {
        if(gameData.diaBal < 10) return tg.showAlert("Yetersiz Elmas!");
        gameData.diaBal -= 10;
        const btn = document.getElementById('spin-btn');
        const disp = document.getElementById('wheel-display');
        btn.disabled = true;
        disp.style.transform = "rotate(1440deg)";

        setTimeout(() => {
            disp.style.transform = "rotate(0deg)";
            let r = Math.random();
            let msg = "";
            if(r < 0.05) { 
                let locked = gameData.birds.filter(b => !b.owned);
                if(locked.length > 0) {
                    let w = locked[locked.length-1];
                    w.owned = true; addBirdToStage(w); msg = "🦅 KARTAL KAZANDIN!";
                } else { gameData.diaBal += 100; msg = "💎 100 ELMAS!"; }
            }
            else if(r < 0.3) { gameData.diaBal += 20; msg = "💎 20 ELMAS!"; }
            else { gameData.eggBal += 1000; msg = "🥚 1000 YUMURTA!"; }
            
            document.getElementById('wheel-status').innerText = msg;
            btn.disabled = false;
            updateUI();
        }, 3000);
    }

    function toggleMenu() {
        const p = document.getElementById('side-panel');
        p.style.display = (p.style.display === 'flex') ? 'none' : 'flex';
    }

    function openModal(id) {
        closeAll();
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('modal-' + id).style.display = 'block';
    }

    function closeAll() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('side-panel').style.display = 'none';
    }

    function renderBirds() {
        const l = document.getElementById('birds-list'); l.innerHTML = '';
        gameData.birds.filter(b => b.owned).forEach(b => {
            l.innerHTML += `<div class="card"><div><b>${b.icon} ${b.name}</b><br><small>${b.rate*60} 🥚/saat</small></div><button class="btn" onclick="upgradeBird(${b.id})">UP (${b.lvl*200} 🥚)</button></div>`;
        });
    }

    function renderShop() {
        const l = document.getElementById('bird-shop-list'); l.innerHTML = '';
        gameData.birds.filter(b => !b.owned).forEach(b => {
            l.innerHTML += `<div class="card"><div><b>${b.icon} ${b.name}</b><br><small>${b.rate*60} 🥚/saat</small></div><button class="btn" onclick="buyBird(${b.id})">${b.priceDia} 💎</button></div>`;
        });
    }

    function buyBird(id) {
        if(gameData.diaBal >= gameData.birds[id].priceDia) {
            gameData.diaBal -= gameData.birds[id].priceDia;
            gameData.birds[id].owned = true; addBirdToStage(gameData.birds[id]); updateUI();
        }
    }

    function addBirdToStage(b) {
        if(document.getElementById('sb-' + b.id)) return;
        const e = document.createElement('div');
        e.id = 'sb-' + b.id; e.className = 'bird'; e.innerHTML = b.icon;
        document.getElementById('game-stage').appendChild(e);
        setInterval(() => { e.style.left = Math.random()*80+"%"; e.style.top = (Math.random()*45+10)+"%"; }, 3000);
        setInterval(() => createEgg(b.id), (60000 / b.rate));
    }

    function createEgg(bid) {
        if(gameData.storage >= gameData.maxStorage) return;
        const b = document.getElementById('sb-' + bid); if(!b) return;
        const eg = document.createElement('div'); eg.className = 'egg-anim'; eg.innerText = '🥚';
        eg.style.left = b.offsetLeft+"px"; eg.style.top = b.offsetTop+"px";
        eg.style.setProperty('--tx', ((window.innerWidth/2)-b.offsetLeft)+"px");
        eg.style.setProperty('--ty', ((window.innerHeight*0.75)-b.offsetTop)+"px");
        document.getElementById('game-stage').appendChild(eg);
        setTimeout(() => { eg.remove(); gameData.storage = Math.min(gameData.storage+1, gameData.maxStorage); updateUI(); }, 1000);
    }

    function collectEggs() { if(gameData.storage > 0) { gameData.eggBal += gameData.storage; gameData.storage = 0; updateUI(); } }

    function upgradeBird(id) {
        let c = gameData.birds[id].lvl * 200;
        if(gameData.eggBal >= c) { gameData.eggBal -= c; gameData.birds[id].lvl++; gameData.birds[id].rate *= 1.15; updateUI(); }
    }

    function claimDaily() {
        let n = Date.now();
        if(n - gameData.lastDaily > 86400000) { gameData.eggBal += 500; gameData.lastDaily = n; updateUI(); tg.showAlert("500 🥚 Alındı!"); }
    }

    function checkDailyTimer() {
        let d = 86400000 - (Date.now() - gameData.lastDaily);
        document.getElementById('timer').innerText = d > 0 ? "Kalan: " + Math.floor(d/3600000) + "s" : "Hediye Hazır!";
    }

    function addTickerMessage(m) {
        const t = document.getElementById('ticker-text');
        t.innerText = m + " • " + t.innerText;
    }

    gameData.birds.filter(b => b.owned).forEach(addBirdToStage);
    updateUI();
</script>
</body>
</html>
